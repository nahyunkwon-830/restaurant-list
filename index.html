<style>
:root {
  --mist: #e9eef5;
  --paper: #f4f7fb;
  --surface: #ffffff;
  --ink: #191f28;
  --ink-soft: #8b95a1;
  --sea: #3182f6;
  --line: #e3e9f1;
  --buoy: #3182f6;
  --tint: rgba(49, 130, 246, .1);
  --card: #ffffff;
  --radius: 16px;
  --serif: "Pretendard Variable", Pretendard, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --sans: "Pretendard Variable", Pretendard, "Noto Sans JP", "Hiragino Sans", "Yu Gothic", -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --pad: clamp(16px, 5vw, 28px);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.7; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
a { color: var(--sea); text-decoration-thickness: 1px; text-underline-offset: 3px; }
button { font-family: inherit; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--buoy); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 720px; margin: 0 auto; padding: 0 var(--pad); }

/* top bar */
.bar { position: sticky; top: 0; z-index: 20; background: rgba(244, 247, 251, .9); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); padding-top: env(safe-area-inset-top, 0px); }
.bar .wrap { display: flex; align-items: center; justify-content: space-between; height: 52px; gap: 12px; }
.seg { display: flex; background: var(--mist); border-radius: 12px; padding: 4px; gap: 2px; flex: none; }
.seg button { font: 600 13px/1 var(--sans); padding: 8px 15px; border: 0; background: transparent; color: var(--ink-soft); cursor: pointer; border-radius: 9px; transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0, 0, 0, .1); }
.seg.lang button { font-size: 12px; letter-spacing: .04em; padding: 8px 12px; }

/* hero */
.hero { background: var(--paper); padding: 36px 0 12px; }
.hero h1 { font-family: var(--serif); font-weight: 700; font-size: clamp(26px, 7vw, 38px); line-height: 1.25; letter-spacing: -.02em; margin: 0 0 12px; }
.hero .lead { max-width: 30em; margin: 0 0 18px; color: var(--ink-soft); font-size: 15px; }
.when { font-size: 13px; color: var(--ink-soft); margin: 0 0 20px; background: var(--surface); border-radius: 14px; padding: 14px 16px; line-height: 1.6; }
.when strong { color: var(--ink); font-weight: 600; }
.wave { display: none; }

/* filters */
.filters { padding: 20px 0 6px; }
.frow { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.flabel { flex: none; width: 4.6em; font-size: 12px; color: var(--ink-soft); }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0; margin-right: calc(var(--pad) * -1); padding-right: var(--pad); }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; font: 500 13.5px/1 var(--sans); padding: 10px 14px; border: 0; background: var(--surface); color: var(--ink-soft); border-radius: 10px; cursor: pointer; white-space: nowrap; transition: background .15s, color .15s; }
.chip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.fmeta { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 6px 0 4px; }
.count { font-size: 13px; color: var(--ink-soft); }
.count b { font-family: var(--serif); font-size: 20px; color: var(--ink); font-weight: 600; margin-right: 2px; }
.reset { font-size: 13px; background: none; border: 0; color: var(--sea); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; padding: 6px 0; }
.area-intro { margin: 4px 0 6px; color: var(--ink-soft); font-size: 14px; max-width: 32em; }

/* list rows: thumbnail + text */
.list { padding-bottom: 8px; }
.item { display: grid; grid-template-columns: 96px 1fr; gap: 16px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.thumb { position: relative; width: 96px; height: 96px; border-radius: 16px; overflow: hidden; background: var(--mist); display: grid; place-items: center; }
.thumb svg { width: 40px; height: 40px; fill: none; stroke: var(--ink-soft); stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; opacity: .6; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.body { min-width: 0; }
.name { font-size: 17px; font-weight: 600; line-height: 1.4; margin: 0; }
.ko { margin: 0; font-size: 12.5px; color: var(--ink-soft); }
.sub { margin: 3px 0 0; font-size: 13px; color: var(--ink-soft); }
.sub .dist { color: var(--sea); font-weight: 500; }
.desc { margin: 6px 0 0; font-size: 14px; line-height: 1.6; }
.meta { margin: 4px 0 0; font-size: 12.5px; color: var(--ink-soft); display: flex; flex-wrap: wrap; gap: 0 14px; }
.feats { margin: 8px 0 0; display: flex; flex-wrap: wrap; gap: 5px; }
.feat { font-size: 12px; color: var(--sea); background: var(--tint); border-radius: 6px; padding: 2px 8px; line-height: 1.7; }
.links { margin: 10px 0 0; display: flex; flex-wrap: wrap; gap: 6px; }
.links a, .links button { font: 500 12.5px/1.5 var(--sans); text-decoration: none; border: 0; background: var(--surface); border-radius: 8px; padding: 7px 12px; color: var(--ink); cursor: pointer; transition: background .15s; }
.links a:hover, .links button:hover { background: #e5e8eb; }
.empty { padding: 40px 0; text-align: center; color: var(--ink-soft); }

/* map view */
.mapview { padding: 16px 0 8px; }
.mapframe { position: relative; width: 100%; height: min(58vh, 460px); border-radius: 14px; overflow: hidden; border: 1px solid var(--line); background: var(--mist); }
.mapframe iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.mapnote { font-size: 13px; color: var(--ink-soft); margin: 10px 0 0; }
.pickers { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 12px 0 4px; margin-right: calc(var(--pad) * -1); padding-right: var(--pad); }
.pickers::-webkit-scrollbar { display: none; }
.picker { flex: none; width: 150px; text-align: left; border: 0; background: var(--surface); border-radius: 12px; padding: 8px; cursor: pointer; color: var(--ink); }
.picker[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--sea); }
.picker .thumb { width: 100%; height: 64px; border-radius: 6px; margin-bottom: 6px; }
.picker .thumb svg { width: 30px; height: 30px; }
.picker span { display: block; font-size: 12.5px; line-height: 1.4; }
.maplinks { margin-top: 10px; }


/* leaflet map */
.mapframe #leafmap { position: absolute; inset: 0; z-index: 0; }
.leaflet-container { font-family: var(--sans); background: var(--mist); }
.pin { background: none; border: 0; }
.pinbody { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 50%; background: #8b95a1; border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.25); transition: transform .15s; }
.pinbody svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.pinbody.on { background: var(--sea); transform: scale(1.25); }
.leaflet-popup-content { margin: 12px 14px; color: #191f28; font-size: 13.5px; line-height: 1.55; }
.pop b { display: block; font-size: 14.5px; font-weight: 600; }
.pop .k { color: #8b95a1; font-size: 12px; }
.pop .pl { margin-top: 6px; display: flex; gap: 10px; }
.pop a { color: #3182f6; font-size: 12.5px; }
.picker.set::after { content: "\2713"; float: right; color: var(--sea); font-size: 12px; }
.editor { margin: 16px 0 0; padding: 14px; border: 1px dashed var(--buoy); border-radius: 12px; background: var(--card); font-size: 13px; }
.editor p { margin: 0 0 10px; }
.editor .edrow { display: flex; gap: 8px; margin-bottom: 8px; }
.editor select, .editor input { flex: 1; min-width: 0; font: 400 14px var(--sans); padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); }
.editor button { font: 500 13px var(--sans); padding: 9px 14px; border: 0; border-radius: 8px; background: var(--sea); color: #fff; cursor: pointer; flex: none; }
.editor textarea { width: 100%; font: 12px/1.5 ui-monospace, Menlo, monospace; padding: 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); color: var(--ink); margin-bottom: 8px; }

/* bottom sections */
.block { padding: 40px 0 0; }
.block h2 { font-family: var(--serif); font-weight: 600; font-size: 22px; margin: 0 0 6px; }
.block .lead2 { margin: 0 0 8px; color: var(--ink-soft); font-size: 14px; max-width: 32em; }
.course { margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.course li { font-family: var(--serif); font-size: 17px; }
.course li + li::before { content: "→"; color: var(--buoy); margin-right: 10px; font-family: var(--sans); }
.source { font-size: 12.5px; color: var(--ink-soft); margin: 10px 0 0; }
.access-list { margin: 12px 0 0; padding: 0; list-style: none; }
.access-list li { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.access-list span:last-child { color: var(--sea); font-weight: 500; text-align: right; }
footer { margin-top: 56px; background: var(--mist); padding: 32px 0 calc(36px + env(safe-area-inset-bottom, 0px)); text-align: center; }
footer .names { font-family: var(--serif); font-size: 19px; margin: 0 0 6px; }
footer p { margin: 0 0 6px; font-size: 13px; color: var(--ink-soft); }
footer .note { max-width: 30em; margin: 0 auto 16px; }

@media (min-width: 560px) { .item { grid-template-columns: 124px 1fr; gap: 18px; } .thumb { width: 124px; height: 124px; } }
@media (prefers-reduced-motion: no-preference) { .hero .wave path { animation: drift 14s linear infinite; } @keyframes drift { to { transform: translateX(-160px); } } }
@media (prefers-color-scheme: dark) {
  :root { --paper: #17171c; --mist: #26262c; --surface: #26262c; --ink: #f2f4f6; --ink-soft: #9199a3; --sea: #4a92ff; --buoy: #4a92ff; --tint: rgba(74, 146, 255, .16); --line: #2a2a30; --card: #1e1e24; }

  .chip[aria-pressed="true"] { background: #f2f4f6; color: #17171c; }
  .links a:hover, .links button:hover { background: #33333a; }
}

    '<p class="desc">' + it.d[lang] + '</p>' + meta + feats +
    '<p class="links">' + (canMap(it) ? '<button type="button" data-map="' + it.id + '">' + ui.showMap + '</button>' : "") +
    '<a href="' + gUrl(it.q) + '" target="_blank" rel="noopener">' + ui.google + '</a>' +
    '<a href="' + nUrl(it.q) + '" target="_blank" rel="noopener">' + ui.naver + '</a></p></div></article>';
}

function resultHead(list) {
  var ui = UI[lang];
  var active = fArea !== "all" || fCat !== "all";
  var intro = (fArea !== "all") ? '<p class="area-intro">' + find(AREAS, fArea).intro[lang] + '</p>' : "";
  return '<div class="fmeta"><span class="count">' + ui.count(list.length) + '</span>' +
    (active ? '<button type="button" class="reset" data-reset="1">' + ui.reset + '</button>' : "") + '</div>' + intro;
}

function listHtml() {
  var ui = UI[lang], list = filtered();
  var body = list.length ? list.map(itemHtml).join("") :
    '<div class="empty"><p>' + ui.empty + '</p><button type="button" class="reset" data-reset="1">' + ui.reset + '</button></div>';
  var bottom =
    '<section class="block"><h2>' + COURSE.title[lang] + '</h2>' +
    '<ol class="course">' + COURSE.steps[lang].map(function (s) { return '<li>' + s + '</li>'; }).join("") + '</ol>' +
    '<p class="source">' + COURSE.src[lang] + '</p></section>' +
    '<section class="block"><h2>' + ACCESS.title[lang] + '</h2><p class="lead2">' + ACCESS.intro[lang] + '</p>' +
    '<ul class="access-list">' + ACCESS.rows.map(function (r) { return '<li><span>' + r.l[lang] + '</span><span>' + r.v[lang] + '</span></li>'; }).join("") + '</ul></section>';
  return resultHead(list) + '<div class="list">' + body + '</div>' + bottom;
}

/* ---------- map (Leaflet + OpenStreetMap) ---------- */
var EDIT = new URLSearchParams(location.search).get("edit") === "1";
var LMAP = null, MARKERS = {};
if (EDIT) { try { var saved = JSON.parse(localStorage.getItem("guide-coords") || "{}"); for (var kk in saved) COORDS[kk] = saved[kk]; } catch (e) {} }

function hasCoords() { for (var k in COORDS) return true; return false; }
function canMap(it) { return EDIT || !hasCoords() || !!COORDS[it.id]; }
function mapItems() {
  var list = filtered();
  return (EDIT || !hasCoords()) ? list : list.filter(function (it) { return COORDS[it.id]; });
}
function pinIcon(it, on) {
  return L.divIcon({ className: "pin", iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -18],
    html: '<span class="pinbody' + (on ? ' on' : '') + '"><svg viewBox="0 0 44 44" aria-hidden="true">' + ICONS[it.cat] + '</svg></span>' });
}
function popupHtml(it) {
  var ui = UI[lang];
  return '<div class="pop"><b>' + it.n[lang] + '</b>' + (lang === "jp" ? '<span class="k">' + it.k + '</span>' : "") +
    '<div class="pl"><a href="' + gUrl(it.q) + '" target="_blank" rel="noopener">' + ui.google + '</a>' +
    '<a href="' + nUrl(it.q) + '" target="_blank" rel="noopener">' + ui.naver + '</a></div></div>';
}
function pickerHtml(list) {
  return '<div class="pickers">' + list.map(function (it) {
    return '<button type="button" class="picker' + (COORDS[it.id] ? ' set' : '') + '" data-pick="' + it.id + '" aria-pressed="' + (it.id === selId) + '">' + thumb(it) + '<span>' + it.n[lang] + '</span></button>';
  }).join("") + '</div>';
}

function editorHtml(list) {
  var n = 0; ITEMS.forEach(function (it) { if (COORDS[it.id]) n++; });
  return '<div class="editor"><p><strong>좌표 등록 모드</strong> (이 화면은 주소 끝에 ?edit=1 이 있을 때만 보여요)<br>' +
    '장소를 고른 뒤 구글 지도에서 복사한 좌표를 붙여 넣고 [적용]을 누르거나, 아래 지도를 눌러 위치를 찍어 주세요.</p>' +
    '<div class="edrow"><select id="edSel">' + list.map(function (it) {
      return '<option value="' + it.id + '"' + (it.id === selId ? ' selected' : '') + '>' + (COORDS[it.id] ? '✓ ' : '') + it.k + '</option>';
    }).join("") + '</select></div>' +
    '<div class="edrow"><input id="edLL" placeholder="35.4936, 129.4392" inputmode="decimal" autocomplete="off"><button type="button" data-edset="1">적용</button></div>' +
    '<p id="edStat">' + n + ' / ' + ITEMS.length + ' 등록됨</p>' +
    '<textarea id="edOut" rows="5" readonly></textarea>' +
    '<button type="button" data-edcopy="1">COORDS 코드 복사</button></div>';
}
function edOutText() {
  var lines = [];
  ITEMS.forEach(function (it) { var c = COORDS[it.id]; if (c) lines.push('  "' + it.id + '": [' + c[0] + ', ' + c[1] + ']'); });
  return 'var COORDS = {\n' + lines.join(',\n') + '\n};';
}
function updateEditor() {
  if (!EDIT) return;
  var n = 0; ITEMS.forEach(function (it) { if (COORDS[it.id]) n++; });
  var st = document.getElementById("edStat"); if (st) st.textContent = n + " / " + ITEMS.length + " 등록됨";
  var out = document.getElementById("edOut"); if (out) out.value = edOutText();
  var sel = document.getElementById("edSel");
  if (sel) Array.prototype.forEach.call(sel.options, function (o) { var it = find(ITEMS, o.value); o.textContent = (COORDS[o.value] ? "✓ " : "") + it.k; });
  var inp = document.getElementById("edLL");
  if (inp && selId) inp.value = COORDS[selId] ? COORDS[selId][0] + ", " + COORDS[selId][1] : "";
  document.querySelectorAll(".picker").forEach(function (b) { b.classList.toggle("set", !!COORDS[b.dataset.pick]); });
}
function parseLL(v) {
  var m = String(v).match(/(-?\d+(?:\.\d+)?)\s*[,\s]\s*(-?\d+(?:\.\d+)?)/);
  if (!m) return null;
  var a = parseFloat(m[1]), b = parseFloat(m[2]);
  if (a > 100 && b < 100) { var t = a; a = b; b = t; }   /* 경도, 위도 순서로 붙여 넣은 경우 */
  if (a < 33 || a > 39 || b < 124 || b > 132) return null;
  return [Math.round(a * 1e6) / 1e6, Math.round(b * 1e6) / 1e6];
}
function addMarker(it) {
  var c = COORDS[it.id]; if (!c || !LMAP) return;
  if (MARKERS[it.id]) { MARKERS[it.id].setLatLng(c); return; }
  var m = L.marker(c, { icon: pinIcon(it, it.id === selId), title: it.n[lang], keyboard: true }).addTo(LMAP);
  m.bindPopup(popupHtml(it), { closeButton: false });
  m.on("click", function () { selectItem(it.id, true); });
  MARKERS[it.id] = m;
}
function setCoord(id, ll) {
  COORDS[id] = ll;
  try { localStorage.setItem("guide-coords", JSON.stringify(COORDS)); } catch (e) {}
  addMarker(find(ITEMS, id));
  if (LMAP && MARKERS[id]) { selectItem(id, false); }
  updateEditor();
}
function selectItem(id, fromMap) {
  var prev = selId; selId = id;
  if (prev && MARKERS[prev]) MARKERS[prev].setIcon(pinIcon(find(ITEMS, prev), false));
  var mk = MARKERS[id];
  if (mk) {
    mk.setIcon(pinIcon(find(ITEMS, id), true));
    if (!fromMap) { LMAP.setView(mk.getLatLng(), Math.max(LMAP.getZoom(), 15)); }
    mk.openPopup();
  }
  document.querySelectorAll(".picker").forEach(function (b) {
    var on = b.dataset.pick === id; b.setAttribute("aria-pressed", on ? "true" : "false");
    if (on && fromMap) b.scrollIntoView({ inline: "center", block: "nearest", behavior: "smooth" });
  });
  var sel = document.getElementById("edSel"); if (sel && sel.value !== id) sel.value = id;
  if (EDIT) updateEditor();
}
function destroyMap() { if (LMAP) { LMAP.remove(); LMAP = null; } MARKERS = {}; }
function initMap() {
  destroyMap();
  var el = document.getElementById("leafmap"); if (!el) return;
  if (typeof L === "undefined") { el.innerHTML = '<p class="empty">' + UI[lang].mapFail + '</p>'; return; }
  LMAP = L.map(el, { scrollWheelZoom: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors' }).addTo(LMAP);
  var pts = [];
  mapItems().forEach(function (it) { if (COORDS[it.id]) { addMarker(it); pts.push(COORDS[it.id]); } });
  if (selId && MARKERS[selId]) { LMAP.setView(MARKERS[selId].getLatLng(), 15); selectItem(selId, false); }
  else if (pts.length) LMAP.fitBounds(pts, { padding: [40, 40], maxZoom: 16 });
  else LMAP.setView([35.5384, 129.3114], 11);
  if (EDIT) LMAP.on("click", function (e) { if (selId) setCoord(selId, [Math.round(e.latlng.lat * 1e6) / 1e6, Math.round(e.latlng.lng * 1e6) / 1e6]); });
  setTimeout(function () { if (LMAP) LMAP.invalidateSize(); }, 0);
  updateEditor();
}

/* 좌표가 하나도 없을 때는 예전처럼 구글 지도를 한 곳씩 보여 줍니다 */
function embedHtml(list) {
  var ui = UI[lang];
  var sel = find(list, selId) || list[0]; selId = sel.id;
  return '<div class="mapview"><div class="mapframe"><iframe title="map" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="' + embedUrl(sel.q) + '"></iframe></div>' +
    '<p class="mapnote">' + ui.mapPick + '</p>' + pickerHtml(list) +
    '<p class="links maplinks"><a href="' + gUrl(sel.q) + '" target="_blank" rel="noopener">' + ui.google + '</a>' +
    '<a href="' + nUrl(sel.q) + '" target="_blank" rel="noopener">' + ui.naver + '</a></p></div>';
}

function mapHtml() {
  var ui = UI[lang], list = mapItems();
  var out = resultHead(list);
  if (!list.length) return out + '<div class="empty"><p>' + ui.empty + '</p><button type="button" class="reset" data-reset="1">' + ui.reset + '</button></div>';
  if (!EDIT && !hasCoords()) return out + embedHtml(list);
  if (!find(list, selId)) selId = list[0].id;
  return out + (EDIT ? editorHtml(list) : "") +
    '<div class="mapview"><div class="mapframe"><div id="leafmap"></div></div>' +
    '<p class="mapnote">' + ui.mapTap + '</p>' + pickerHtml(list) + '</div>';
}

/* ---------- main render ---------- */
function render(keepScroll) {
  var ui = UI[lang];
  document.documentElement.lang = (lang === "kr") ? "ko" : "ja";
  document.title = ui.pageTitle + " | Park Youngjae & Kwon Nahyun";
  document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.lang === lang ? "true" : "false"); });
  document.getElementById("viewSeg").innerHTML =
    '<button type="button" data-view="list" aria-pressed="' + (view === "list") + '">' + ui.list + '</button>' +
    '<button type="button" data-view="map" aria-pressed="' + (view === "map") + '">' + ui.map + '</button>';

  var hero = '<section class="hero"><div class="wrap">' +
    '<h1>' + ui.pageTitle + '</h1><p class="lead">' + ui.lead + '</p><p class="when">' + ui.when + '</p>' +
    '</div></section>';

  var footer = '<footer><div class="wrap"><p class="names">' + ui.names + '</p><p class="note">' + ui.footNote + '</p>' +
    '<p><a href="' + INVITATION_URL + '?lang=' + lang + '">' + ui.invitation + '</a></p></div></footer>';

  var y = window.scrollY;
  destroyMap();
  document.getElementById("app").innerHTML = hero +
    '<div class="wrap" id="filterWrap">' + filtersHtml() + '</div>' +
    '<div class="wrap" id="results">' + (view === "map" ? mapHtml() : listHtml()) + '</div>' + footer;
  if (view === "map") initMap();
  if (keepScroll) window.scrollTo(0, y);
}

/* re-render only filters + results (keeps chip scroll positions simple, avoids hero flicker) */
function syncSeg() {
  document.querySelectorAll("#viewSeg button").forEach(function (b) { b.setAttribute("aria-pressed", b.dataset.view === view ? "true" : "false"); });
}
function refresh() {
  var y = window.scrollY;
  syncSeg();
  destroyMap();
  document.getElementById("filterWrap").innerHTML = filtersHtml();
  document.getElementById("results").innerHTML = (view === "map" ? mapHtml() : listHtml());
  if (view === "map") initMap();
  window.scrollTo(0, y);
}

function setLang(l) {
  if (LANGS.indexOf(l) < 0) return;
  lang = l;
  try { localStorage.setItem("guide-lang", l); } catch (e) {}
  try { var u = new URL(location.href); u.searchParams.set("lang", l); history.replaceState(null, "", u); } catch (e) {}
  render(true);
}

/* ---------- events ---------- */
document.addEventListener("click", function (e) {
  var t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.lang) return setLang(t.dataset.lang);
  if (t.dataset.view) { view = t.dataset.view; refresh(); window.scrollTo(0, document.getElementById("filterWrap").offsetTop - 60); return; }
  if (t.dataset.fa) { fArea = t.dataset.fa; return refresh(); }
  if (t.dataset.fc) { fCat = t.dataset.fc; return refresh(); }
  if (t.dataset.reset) { fArea = "all"; fCat = "all"; return refresh(); }
  if (t.dataset.map) {
    selId = t.dataset.map; view = "map";
    /* 선택한 곳이 필터에 걸리지 않으면 필터를 풀어 줍니다 */
    if (!find(filtered(), selId)) { fArea = "all"; fCat = "all"; }
    refresh(); window.scrollTo(0, document.getElementById("filterWrap").offsetTop - 60); return;
  }
  if (t.dataset.pick) {
    if (LMAP) return selectItem(t.dataset.pick, false);
    selId = t.dataset.pick; return refresh();
  }
  if (t.dataset.edset) {
    var ll = parseLL(document.getElementById("edLL").value);
    if (!ll) { alert("좌표를 읽을 수 없어요. 구글 지도에서 복사한 '35.4936, 129.4392' 형태로 붙여 넣어 주세요."); return; }
    return setCoord(selId, ll);
  }
  if (t.dataset.edcopy) {
    var out = document.getElementById("edOut"); out.value = edOutText(); out.select();
    try { navigator.clipboard.writeText(out.value); } catch (er) { document.execCommand("copy"); }
    t.textContent = "복사했어요"; setTimeout(function () { t.textContent = "COORDS 코드 복사"; }, 1500);
  }
});
document.addEventListener("change", function (e) {
  if (e.target.id === "edSel") { if (LMAP) selectItem(e.target.value, false); else selId = e.target.value; updateEditor(); }
});
document.addEventListener("keydown", function (e) {
  if (e.key === "Enter" && e.target.id === "edLL") { e.preventDefault(); var b = document.querySelector("[data-edset]"); if (b) b.click(); }
});

lang = pickLang();
render(false);
</script>
</body>
</html>
